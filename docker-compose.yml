services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER:-erp} -d $${POSTGRES_DB:-erp}"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISHED_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: "5432"
    ports:
      - "${APP_PUBLISHED_PORT:-30000}:30000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:30000"
    volumes:
      - ./backend:/app
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: "5432"
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - ./backend:/app
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./.env
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: "5432"
    command:
      - celery
      - -A
      - config
      - beat
      - -l
      - info
      - --scheduler
      - django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    depends_on:
      - api
    ports:
      - "${FRONTEND_PUBLISHED_PORT:-30080}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

  catalog:
    build:
      context: ./catalog
      dockerfile: Dockerfile
    env_file:
      - ./.env
    environment:
      NEXT_PUBLIC_API_URL: ${CATALOG_NEXT_PUBLIC_API_URL:-http://localhost:30000/api/catalog/v1}
      # Серверный fetch (RSC) ходит к api по docker-сети, не к localhost.
      CATALOG_API_URL_INTERNAL: ${CATALOG_API_URL_INTERNAL:-http://api:30000/api/catalog/v1}
      NEXT_PUBLIC_SITE_URL: ${CATALOG_NEXT_PUBLIC_SITE_URL:-http://localhost:30081}
      NEXT_PUBLIC_ERP_URL: ${CATALOG_NEXT_PUBLIC_ERP_URL:-http://localhost:30080}
      NEXT_PUBLIC_YM_ID: ${CATALOG_YM_ID:-}
      NEXT_PUBLIC_GA_ID: ${CATALOG_GA_ID:-}
      REVALIDATE_SECRET: ${CATALOG_REVALIDATE_SECRET:-dev-secret}
    depends_on:
      - api
    ports:
      - "${CATALOG_PUBLISHED_PORT:-30081}:3001"
    restart: unless-stopped

volumes:
  postgres_data:
